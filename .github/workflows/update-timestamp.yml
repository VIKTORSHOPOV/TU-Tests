name: Update Last Updated Timestamp

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update last updated timestamp
        env:
          TZ: Europe/Sofia
        run: |
          TIMESTAMP=$(date +"%d.%m.%Y %H:%M")
          sed -i 's|<span id="update-date">[^<]*</span>|<span id="update-date">'"${TIMESTAMP}"'</span>|' exam.html
          sed -i 's|<span id="update-date">[^<]*</span>|<span id="update-date">'"${TIMESTAMP}"'</span>|' index.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/VIKTORSHOPOV/TU-Tests.git
          git add exam.html index.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: update last updated timestamp [skip ci]"
            git push
          fi
